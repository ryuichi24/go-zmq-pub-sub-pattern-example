name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            arch: amd64
            docker_platform: linux/amd64
          - runner: macos-13
            goos: darwin
            arch: amd64
          - runner: macos-14
            goos: darwin
            arch: arm64
          - runner: windows-latest
            goos: windows
            arch: amd64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.3"

      - name: Install ZeroMQ (macOS or Linux)
        if: matrix.goos == 'darwin' || matrix.goos == 'linux'
        env:
          VCPKG_DISABLE_METRICS: 1
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              triplet="arm64-osx"
            else
              triplet="x64-osx"
            fi
          else
            triplet="x64-linux"
          fi
          ./vcpkg install zeromq:$triplet
          echo "PKG_CONFIG_PATH=${{ github.workspace }}/vcpkg/installed/$triplet/lib/pkgconfig:${{ github.workspace }}/vcpkg/installed/$triplet/share/pkgconfig" >> $GITHUB_ENV

      - name: Install ZeroMQ (Windows)
        if: matrix.goos == 'windows'
        env:
          VCPKG_DISABLE_METRICS: 1
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.bat -disableMetrics
          ./vcpkg install zeromq:x64-windows

          $vcpkgRoot = "${{ github.workspace }}/vcpkg"
          $installDir = "$vcpkgRoot/installed/x64-windows"
          $pkgConfigPath = "$installDir/lib/pkgconfig;$installDir/share/pkgconfig"
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=$pkgConfigPath"

          $zmqLibs = Get-ChildItem -Path "$installDir/lib" -Filter "*zmq*.lib" | Where-Object { $_.Name -match "libzmq.*\.lib$" }
          if ($zmqLibs.Count -eq 0) {
            Write-Error "No ZeroMQ library found in $installDir/lib"
            exit 1
          }
          $zmqLibName = $zmqLibs[0].Name
          Add-Content -Path $env:GITHUB_ENV -Value "CGO_CFLAGS=-I$installDir/include"
          Add-Content -Path $env:GITHUB_ENV -Value "CGO_LDFLAGS=-L$installDir/lib -l:$zmqLibName"

      - name: Build Go binaries
        run: |
          make build-pub
          make build-sub

      - name: Prepare artifacts (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $outDir = "artifacts/${{ matrix.goos }}-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $outDir
          Copy-Item -Path "dist/pub.exe" -Destination "$outDir/pub.exe" -Force
          Copy-Item -Path "dist/sub.exe" -Destination "$outDir/sub.exe" -Force

          $dllPath = Get-ChildItem -Path "${{ github.workspace }}/vcpkg/installed/x64-windows/bin" -Filter "libzmq*.dll" | Select-Object -First 1
          if (-Not $dllPath) {
            Write-Error "libzmq DLL not found!"
            exit 1
          }
          Copy-Item -Path $dllPath.FullName -Destination "$outDir/" -Force

      - name: Prepare artifacts (Unix)
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          out_dir="artifacts/${{ matrix.goos }}-${{ matrix.arch }}"
          mkdir -p "$out_dir"
          cp dist/pub "$out_dir/pub"
          cp dist/sub "$out_dir/sub"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.arch }}
          path: artifacts/${{ matrix.goos }}-${{ matrix.arch }}
          retention-days: 1

  create-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts-raw

      - name: Zip each platform artifact folder
        run: |
          mkdir zipped
          for dir in artifacts-raw/*; do
            name=$(basename "$dir")
            zip -r "zipped/${name}.zip" "$dir"
          done

      - name: Create Release and Upload Zips
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs').promises;
            const path = require('path');
            const tagName = context.ref.replace('refs/tags/', '');

            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `Release ${tagName}`,
              generate_notes: true,
              draft: false,
              prerelease: false
            });

            const zipDir = path.resolve(process.env.GITHUB_WORKSPACE, 'zipped');
            const zipFiles = await fs.readdir(zipDir);

            for (const fileName of zipFiles) {
              const filePath = path.join(zipDir, fileName);
              const content = await fs.readFile(filePath);

              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: fileName,
                data: content,
                headers: {
                  'content-type': 'application/zip',
                  'content-length': content.length,
                },
              });
            }
